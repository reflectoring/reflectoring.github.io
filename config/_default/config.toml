######################## default configuration ####################
baseURL = "http://localhost:1313"
title = "Reflectoring - Where the HOW meets the WHY"
theme = "geeky"
languageName = "En"
locale = "en-US"
# post pagination: see [pagination] below
# post excerpt
summaryLength = "20"
# Keep list titles as written (Hugo 0.123+ capitalizes them, e.g. author names).
capitalizeListTitles = false
# disable language
disableLanguages = ["fr"] # example: ["fr"] for disable french language

############################# Modules ##############################
[module]
[module.hugoVersion]
extended = true
min = "0.168.0"

############################# Outputs ##############################
[outputs]
home = ["HTML", "RSS", "JSON", "WebAppManifest"]

############################# Pagination ###########################
[pagination]
pagerSize = 6

############################# Imaging ##############################
[imaging]
# See https://github.com/disintegration/imaging
[imaging.jpeg]
quality = 90
[imaging.webp]
quality = 90

############################# Caches ###############################
[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"


############################# Markup ###############################
[markup]
[markup.goldmark.renderer]
unsafe= true


############################ Media types ############################
[mediaTypes]
[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]

[mediaTypes."text/netlify"]
delimiter = ""
suffixes = [""]


############################ Output Format ###########################
[outputFormats]
[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
rel = "manifest"

[taxonomies]
author = "authors"
tag = "tags"
category = "categories"